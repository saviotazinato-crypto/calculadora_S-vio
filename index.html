     <button type =" button" id="-" onclick="escreverNodisplay('-')"> - </button>

    <script>
        var dysplay = ""
        var btntexts = ""
        function escreverNodisplay(n) {
document.getElementById('clickSound').play();
            document.getElementById("display").innerText = dysplay + n;
            dysplay = document.getElementById("display").innerText;
        }
        function resultado() {
            document.getElementById('clickSound').play();
            dysplay = eval(dysplay);

            document.getElementById("display").innerText = dysplay


        }
        function apagar1(n) {
            document.getElementById('clickSound').play();
            dysplay = dysplay.slice(0, -1);
            document.getElementById("display").innerText = dysplay;
            dysplay = document.getElementById("display").innerText;
        }
